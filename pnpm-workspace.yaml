packages:
  - "packages/*"
nodeLinker: hoisted

# Keep direct and transitive npm releases in quarantine for 7 days.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Reject weaker publisher trust and recheck even frozen lockfile entries.
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
saveExact: true

# Upgrade these pins together after a manual Pi review. Keep published peers at '*'.
# These overrides prevent Pi updates during full lock-file maintenance.
overrides:
  '@earendil-works/pi-agent-core': 1.5.0
  '@earendil-works/pi-ai': 1.5.0
  '@earendil-works/pi-codemode': 1.5.0
  '@earendil-works/pi-coding-agent': 1.5.0
  '@earendil-works/pi-mcp': 1.5.0
  '@earendil-works/pi-telemetry': 1.5.0
  '@earendil-works/pi-tui': 1.5.0

peerDependencyRules:
  allowAny:
    - tree-sitter

allowBuilds:
  # tree-sitter@0.25.0 pins -std=c++17 in binding.gyp, but Node 24's V8
  # headers require C++20, so the native build fails. The package ships no
  # prebuilds, but we never import the native binding — supi-tree-sitter uses
  # web-tree-sitter (WASM) at runtime. Skip the build.
  tree-sitter: false
  tree-sitter-kotlin: false
  '@davisvaughan/tree-sitter-r': false
  '@derekstride/tree-sitter-sql': false
  '@pfoerster/tree-sitter-latex': false
  '@google/genai': true
  koffi: true
  protobufjs: true
  tree-sitter-bash: true
  tree-sitter-c: true
  tree-sitter-cli: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-html: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  esbuild: true

# Exceptions are version-specific; future Pi upgrades must be reviewed again.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.5.0'
  - '@earendil-works/pi-ai@1.5.0'
  - '@earendil-works/pi-codemode@1.5.0'
  - '@earendil-works/pi-coding-agent@1.5.0'
  - '@earendil-works/pi-mcp@1.5.0'
  - '@earendil-works/pi-schema@1.5.0'
  - '@earendil-works/pi-telemetry@1.5.0'
  - '@earendil-works/pi-tui@1.5.0'
  # Pi 1.5.0 pins minimatch 11.0.3, which requires this glob matcher.
  - 'minimatch@11.0.3'
  - '@isaacs/nonrecursive-glob-match@1.0.3'
  # Older mature Smithy releases are deprecated for a logger-redaction bug.
  - '@smithy/core@3.38.1'

patchedDependencies:
  # Apply the patch to new upstream versions and fail when it no longer applies.
  "mattpocock-skills@*": packages/supi-skill-patches/patches/mattpocock-skills/combined.patch
