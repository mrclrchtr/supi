name: Maintain release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Maintenance can coalesce main pushes; release candidates in ci.yml cannot.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    steps:
      - name: Create release-please app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MRCLRCHTR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MRCLRCHTR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Update the release PR without creating tags or releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
