name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  conventional-commits:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?(!)?: .+$'

          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "PR title must follow Conventional Commits."
            echo "Example: feat(lsp): add diagnostics summary"
            echo "Got: $PR_TITLE"
            exit 1
          fi

      - name: Validate current commit (last commit)
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  workspace-checks:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Check release-please config coverage
        run: |
          publishable=$(mktemp)
          configured=$(mktemp)
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ] && [ "$(jq -r '.private // false' "$dir/package.json")" = "false" ]; then
              echo "${dir%/}"
            fi
          done | sort > "$publishable"
          # Single-root release-please config manages versions via extra-files
          jq -r '.packages["."]["extra-files"][] // empty' release-please-config.json | sed 's|/package\.json$||' | sort > "$configured"
          if ! diff -q "$publishable" "$configured"; then
            echo "::error::Mismatch between publishable packages and release-please config"
            diff "$publishable" "$configured" || true
            exit 1
          fi

      - name: Check vendored WASM files
        run: pnpm --filter @mrclrchtr/supi-tree-sitter check:all-wasm

      - name: Check code style
        run: pnpm biome

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Check skills
        run: pnpm skills:check

      - name: Verify staged package tarballs
        run: pnpm pack:verify

  tests:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run test shard
        run: pnpm test --shard=${{ matrix.shard }}/4

  language-baseline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned language toolchains
        run: node scripts/language-baseline/ci-env.mjs >> "$GITHUB_ENV"

      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.SUPI_BASELINE_NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: ${{ env.SUPI_BASELINE_JAVA_DISTRIBUTION }}
          java-version: ${{ env.SUPI_BASELINE_JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.SUPI_BASELINE_GO_VERSION }}

      - name: Provision pinned reference servers
        run: node scripts/language-baseline/provision.mjs

      - name: Run required real-server acceptance suite
        run: pnpm test:language-baseline:acceptance

      - name: Remove isolated server installs
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/supi-language-baseline/gomodcache" ]; then
            GOMODCACHE="$RUNNER_TEMP/supi-language-baseline/gomodcache" go clean -modcache
          fi
          rm -rf "$RUNNER_TEMP/supi-language-baseline"

  installer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "22.19.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Check installer types
        run: pnpm exec tsc -b packages/supi-installer/tsconfig.json packages/supi-installer/__tests__/tsconfig.json
      - name: Check installer behavior
        run: pnpm vitest run packages/supi-installer/ scripts/__tests__/patch-checkout.test.mjs --reporter=agent

  verify:
    if: always()
    needs: [workspace-checks, tests, installer, language-baseline]
    runs-on: ubicloud-standard-2
    timeout-minutes: 5

    steps:
      - name: Require all verification jobs to pass
        env:
          WORKSPACE_RESULT: ${{ needs.workspace-checks.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          LANGUAGE_BASELINE_RESULT: ${{ needs.language-baseline.result }}
        run: |
          if [[ "$WORKSPACE_RESULT" != "success" || "$TEST_RESULT" != "success" || "$INSTALLER_RESULT" != "success" || "$LANGUAGE_BASELINE_RESULT" != "success" ]]; then
            echo "::error::Verification failed: workspace=$WORKSPACE_RESULT tests=$TEST_RESULT installer=$INSTALLER_RESULT language-baseline=$LANGUAGE_BASELINE_RESULT"
            exit 1
          fi

  release-please:
    needs: [actionlint, conventional-commits, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create release-please app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MRCLRCHTR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MRCLRCHTR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
    steps:
      # Repository scripts are not available yet. Full validation follows checkout.
      - name: Require release identity
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::RELEASE_SHA: expected a 40-character commit SHA; actual '$RELEASE_SHA'"
            exit 1
          fi
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "::error::RELEASE_VERSION: expected a release version; actual '$RELEASE_VERSION'"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate release checkout
        run: node scripts/release-validation.mjs

      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Publish released packages from staged tarballs
        run: node scripts/publish-released.mjs
