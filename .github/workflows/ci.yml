name: CI

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Verify and retry publishing an existing release tag"
        required: false
        type: string
        default: ""
      release_sha:
        description: "Verify and retry an untagged release commit on main"
        required: false
        type: string
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# PR updates and newer ordinary main pushes supersede old checks. Release-shaped pushes and manual
# runs get their own group, so nothing replaces a queued release candidate.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release') && github.ref) ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout exact event commit with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js without workspace dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false
      - name: Select verification and immutable checkout
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs

  workflow-lint:
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Install pinned workflow tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: jactionlint shellcheck
      # Configured in .github/jactionlint.yaml; ShellCheck checks run steps.
      - name: Lint GitHub Actions workflows
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
        run: mise exec -- jactionlint

  conventional-commits:
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm without workspace dependencies
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js without workspace dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false
      # Installs only commitlint, at the versions pinned in package.json, instead of the workspace.
      # The workspace lockfile does not pin its transitive dependencies.
      # Lints every commit of the PR or push. Manual runs, and pushes whose previous tip is not
      # in the checkout, lint only the verification commit.
      - name: Validate commits
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.event.pull_request.head.sha || needs.ci-plan.outputs.sha }}
        run: |
          cli="@commitlint/cli@$(jq -r '.devDependencies["@commitlint/cli"]' package.json)"
          config="@commitlint/config-conventional@$(jq -r '.devDependencies["@commitlint/config-conventional"]' package.json)"
          range="--last"
          if [[ -n "$FROM_SHA" ]] && git cat-file -e "$FROM_SHA^{commit}" 2>/dev/null; then
            range="--from $FROM_SHA --to $TO_SHA"
          fi
          # NODE_PATH lets commitlint.config.mjs resolve the shared config from the dlx install.
          pnpm --package "$cli" --package "$config" dlx -c \
            "NODE_PATH=\"\$(dirname \"\$(dirname \"\$(command -v commitlint)\")\")\" commitlint $range --verbose"

  workspace-checks:
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ needs.ci-plan.outputs.sha }}
      RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Validate release metadata before dependencies
        if: needs.ci-plan.outputs.version != ''
        run: node scripts/release-validation.mjs
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
      - name: Run fast workspace checks
        run: |
          pnpm --filter @mrclrchtr/supi-tree-sitter check:all-wasm
          pnpm biome:ai
          pnpm typecheck:ai
          pnpm skills:check
      - name: Verify staged package tarballs
        if: needs.ci-plan.outputs.mode == 'full'
        run: pnpm pack:verify

  # Runs for PRs too. The language-baseline job runs the `servers` project with every server provisioned.
  tests:
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run test suite without real language servers
        run: pnpm test:ai --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-results.json"
      # Per-file and per-test durations on the standard runner, for test-runtime comparisons.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results
          path: ${{ runner.temp }}/vitest-results.json
          if-no-files-found: warn
          retention-days: 14

  language-baseline:
    needs: ci-plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Load pinned language toolchains
        run: node scripts/language-baseline/ci-env.mjs >> "$GITHUB_ENV"
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ env.SUPI_BASELINE_JAVA_DISTRIBUTION }}
          java-version: ${{ env.SUPI_BASELINE_JAVA_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.SUPI_BASELINE_GO_VERSION }}
          # The repository has no root go.mod to key a module cache on; provisioning caches gopls itself.
          cache: false
      # PR runs restore the cache written on main; a PR that changes the key writes one scoped to its branch.
      - name: Restore cached reference servers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/supi-language-baseline-cache
          key: language-baseline-servers-${{ runner.os }}-${{ runner.arch }}-${{ env.SUPI_BASELINE_CACHE_KEY }}
      - name: Provision pinned reference servers
        env:
          SUPI_LANGUAGE_BASELINE_CACHE: ${{ runner.temp }}/supi-language-baseline-cache
        run: node scripts/language-baseline/provision.mjs
      - name: Verify TypeScript installation selection
        run: pnpm exec vitest run --reporter=agent packages/supi-lsp/__tests__/unit/typescript-launch.test.ts
      # Includes the TypeScript lifecycle tests; suites whose server is not provisioned skip.
      - name: Run real language-server integration tests
        env:
          SUPI_TEST_DEBUG_DIR: ${{ runner.temp }}/supi-test-debug
        run: pnpm exec vitest run --reporter=agent --project servers
      - name: Upload debug events of failed server tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-baseline-debug-${{ matrix.os }}
          path: ${{ runner.temp }}/supi-test-debug
          if-no-files-found: ignore
          retention-days: 14
      - name: Run required real-server acceptance suite
        run: pnpm test:language-baseline:acceptance
      - name: Remove isolated server installs
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/supi-language-baseline/gomodcache" ]; then
            GOMODCACHE="$RUNNER_TEMP/supi-language-baseline/gomodcache" go clean -modcache
          fi
          rm -rf "$RUNNER_TEMP/supi-language-baseline"

  installer:
    needs: ci-plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          # Minimum Node.js version from the installer's `engines.node`; keep them in sync.
          node-version: "22.19.0"
      - name: Check installer types
        run: node node_modules/@typescript/native/bin/tsc -b packages/supi-installer/tsconfig.json packages/supi-installer/__tests__/tsconfig.json
      - name: Check installer behavior
        run: pnpm vitest run packages/supi-installer/ scripts/__tests__/patch-checkout.test.mjs --reporter=agent

  verify:
    if: always()
    needs: [ci-plan, workflow-lint, conventional-commits, workspace-checks, tests, installer, language-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check in a known verification mode
        env:
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          MODE: ${{ needs.ci-plan.outputs.mode }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          COMMITS_RESULT: ${{ needs.conventional-commits.result }}
          WORKSPACE_RESULT: ${{ needs.workspace-checks.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          LANGUAGE_BASELINE_RESULT: ${{ needs.language-baseline.result }}
        run: |
          if [[ "$MODE" != full && "$MODE" != checks ]]; then
            echo '::error::Unknown verification mode'
            exit 1
          fi
          for result in "$PLAN_RESULT" "$WORKFLOW_LINT_RESULT" "$COMMITS_RESULT" "$WORKSPACE_RESULT" "$TEST_RESULT" "$INSTALLER_RESULT" "$LANGUAGE_BASELINE_RESULT"; do
            if [[ "$result" != success ]]; then
              echo '::error::Required verification checks did not succeed'
              exit 1
            fi
          done

  create-release:
    needs: [ci-plan, verify]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.ci-plan.result == 'success' && needs.verify.result == 'success' &&
      needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: create-release-${{ needs.ci-plan.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.ci-plan.outputs.sha }}
      RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
    steps:
      - name: Checkout verified release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MRCLRCHTR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MRCLRCHTR_BOT_PRIVATE_KEY }}
          permission-contents: write
          # Re-runs can tag a release commit whose workflow files differ from main;
          # GitHub then requires the workflows permission to create the tag ref.
          permission-workflows: write
      - name: Checkout release tooling from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Tag only the verified commit and create its release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .release-tools/scripts/create-release.mjs

  publish:
    needs: [ci-plan, verify, create-release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.ci-plan.result == 'success' && needs.verify.result == 'success' &&
      needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.version != '' &&
      (
        needs.create-release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '' &&
         needs.create-release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # npm dist-tags are shared across versions, not just retries of one version.
      group: supi-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.ci-plan.outputs.sha }}
      RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Checkout publishing tooling from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Validate release checkout before dependencies or npm access
        run: node .release-tools/scripts/release-validation.mjs
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
      - name: Publish released packages from staged tarballs
        run: node .release-tools/scripts/publish-released.mjs
