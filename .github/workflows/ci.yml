name: CI

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Verify and retry publishing an existing release tag"
        required: false
        type: string
        default: ""
      release_pr:
        description: "Verify and retry a merged release PR before tagging"
        required: false
        type: string
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# PR updates supersede old checks. Distinct main commits must not replace queued release candidates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-plan:
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release-pr: ${{ steps.plan.outputs.release-pr }}
    steps:
      - name: Checkout exact event commit with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js without workspace dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Select verification and immutable checkout
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs

  actionlint:
    needs: ci-plan
    if: needs.ci-plan.outputs.mode != 'none'
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 5
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  conventional-commits:
    needs: ci-plan
    if: needs.ci-plan.outputs.mode != 'none'
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace dependencies
        if: needs.ci-plan.outputs.mode != 'metadata'
        uses: ./.github/actions/setup-pnpm
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?(!)?: .+$'
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "PR title must follow Conventional Commits. Got: $PR_TITLE"
            exit 1
          fi
      - name: Validate current commit
        if: github.event_name != 'pull_request'
        run: pnpm exec commitlint --last --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request' && needs.ci-plan.outputs.mode != 'metadata'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate the metadata-only release commit without dependencies
        if: needs.ci-plan.outputs.mode == 'metadata'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
        run: |
          subject=$(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          if [[ "$subject" != "chore: release $RELEASE_VERSION" ]]; then
            echo '::error::Expected exactly one conventional release commit'
            exit 1
          fi

  workspace-checks:
    needs: ci-plan
    if: needs.ci-plan.outputs.mode != 'none'
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ needs.ci-plan.outputs.sha }}
      RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Validate release metadata before dependencies
        if: needs.ci-plan.outputs.version != ''
        run: node scripts/release-validation.mjs
      - name: Check release-please config coverage
        run: |
          publishable=$(mktemp)
          configured=$(mktemp)
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ] && [ "$(jq -r '.private // false' "$dir/package.json")" = "false" ]; then
              echo "${dir%/}"
            fi
          done | sort > "$publishable"
          jq -r '.packages["."]["extra-files"][] // empty' release-please-config.json | sed 's|/package\.json$||' | sort > "$configured"
          if ! diff -q "$publishable" "$configured"; then
            echo "::error::Mismatch between publishable packages and release-please config"
            diff "$publishable" "$configured" || true
            exit 1
          fi
      - name: Set up workspace dependencies
        if: needs.ci-plan.outputs.mode != 'metadata'
        uses: ./.github/actions/setup-pnpm
      - name: Run fast workspace checks
        if: needs.ci-plan.outputs.mode != 'metadata'
        run: |
          pnpm --filter @mrclrchtr/supi-tree-sitter check:all-wasm
          pnpm biome:ai
          pnpm typecheck:ai
          pnpm skills:check
      - name: Check CI planning and release safety contracts
        if: needs.ci-plan.outputs.mode == 'pr'
        run: pnpm vitest run scripts/__tests__/ci-plan.test.mjs scripts/__tests__/release-workflow.test.mjs scripts/__tests__/verify-workflow.test.mjs --reporter=agent
      - name: Verify staged package tarballs
        if: needs.ci-plan.outputs.mode == 'full'
        run: pnpm pack:verify

  tests:
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full'
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 20
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run complete test suite
        run: pnpm test:ai

  language-baseline:
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [avrea-ubuntu-latest-2-vcpu, macos-latest]
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Load pinned language toolchains
        run: node scripts/language-baseline/ci-env.mjs >> "$GITHUB_ENV"
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.SUPI_BASELINE_NODE_VERSION }}
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.SUPI_BASELINE_JAVA_DISTRIBUTION }}
          java-version: ${{ env.SUPI_BASELINE_JAVA_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.SUPI_BASELINE_GO_VERSION }}
      - name: Provision pinned reference servers
        run: node scripts/language-baseline/provision.mjs
      - name: Verify TypeScript installation selection and lifecycle
        run: >-
          pnpm exec vitest run --reporter=agent
          packages/supi-lsp/__tests__/unit/typescript-launch.test.ts
          packages/supi-lsp/__tests__/integration/workspace-runtime.integration.typescript-native.test.ts
          packages/supi-lsp/__tests__/integration/typescript-config-coverage.test.ts
          packages/supi-lsp/__tests__/integration/workspace-runtime.integration.typescript-launch.test.ts
          packages/supi-lsp/__tests__/integration/workspace-runtime.integration.typescript.test.ts
          packages/supi-lsp/__tests__/integration/client.integration.typescript-diagnostics.test.ts
      - name: Run required real-server acceptance suite
        run: pnpm test:language-baseline:acceptance
      - name: Remove isolated server installs
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/supi-language-baseline/gomodcache" ]; then
            GOMODCACHE="$RUNNER_TEMP/supi-language-baseline/gomodcache" go clean -modcache
          fi
          rm -rf "$RUNNER_TEMP/supi-language-baseline"

  installer:
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [avrea-ubuntu-latest-2-vcpu, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: avrea-ubuntu-latest-2-vcpu
            node: "22.19.0"
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-plan.outputs.sha }}
          persist-credentials: false
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Check installer types
        run: pnpm exec tsc -b packages/supi-installer/tsconfig.json packages/supi-installer/__tests__/tsconfig.json
      - name: Check installer behavior
        run: pnpm vitest run packages/supi-installer/ scripts/__tests__/patch-checkout.test.mjs --reporter=agent

  verify:
    if: always() && (needs.ci-plan.result != 'success' || needs.ci-plan.outputs.mode != 'none')
    needs: [ci-plan, actionlint, conventional-commits, workspace-checks, tests, installer, language-baseline]
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 5
    steps:
      - name: Require exactly the checks selected for this verification mode
        env:
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          MODE: ${{ needs.ci-plan.outputs.mode }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          COMMITS_RESULT: ${{ needs.conventional-commits.result }}
          WORKSPACE_RESULT: ${{ needs.workspace-checks.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          LANGUAGE_BASELINE_RESULT: ${{ needs.language-baseline.result }}
        run: |
          if [[ "$PLAN_RESULT" != success || "$ACTIONLINT_RESULT" != success || "$COMMITS_RESULT" != success || "$WORKSPACE_RESULT" != success ]]; then
            echo '::error::Required verification checks did not succeed'
            exit 1
          fi
          case "$MODE" in
            full) expected=success ;;
            pr|metadata) expected=skipped ;;
            *) echo '::error::Unknown verification mode'; exit 1 ;;
          esac
          for result in "$TEST_RESULT" "$INSTALLER_RESULT" "$LANGUAGE_BASELINE_RESULT"; do
            if [[ "$result" != "$expected" ]]; then
              echo "::error::Unexpected exhaustive-check result: expected=$expected actual=$result"
              exit 1
            fi
          done

  create-release:
    needs: [ci-plan, verify]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.ci-plan.result == 'success' && needs.verify.result == 'success' &&
      needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.release-pr != ''
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    concurrency:
      group: create-release-${{ needs.ci-plan.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_SHA: ${{ needs.ci-plan.outputs.sha }}
      RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
      RELEASE_PR: ${{ needs.ci-plan.outputs.release-pr }}
    steps:
      - name: Checkout verified release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MRCLRCHTR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MRCLRCHTR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Checkout release tooling from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Tag only the verified commit and create its release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .release-tools/scripts/create-release.mjs

  publish:
    needs: [ci-plan, verify, create-release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.ci-plan.result == 'success' && needs.verify.result == 'success' &&
      needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.version != '' &&
      (
        needs.create-release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '' &&
         needs.create-release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # npm dist-tags are shared across versions, not just retries of one version.
      group: supi-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.ci-plan.outputs.sha }}
      RELEASE_VERSION: ${{ needs.ci-plan.outputs.version }}
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Checkout publishing tooling from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Validate release checkout before dependencies or npm access
        run: node .release-tools/scripts/release-validation.mjs
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-pnpm
      - name: Publish released packages from staged tarballs
        run: node .release-tools/scripts/publish-released.mjs
