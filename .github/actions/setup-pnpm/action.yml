# Shared workflow setup. Keep third-party actions pinned by SHA.
name: Setup pnpm workspace
description: Setup Node.js and pnpm, restore cache, and install dependencies
inputs:
  node-version:
    description: Node.js runtime version
    default: "24"
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # version omitted — reads from package.json's packageManager field

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
